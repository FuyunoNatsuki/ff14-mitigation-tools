# main に push したら GitHub Pages に公開する。
# 公開のたびに css/ js/ data/ の読み込みへ ?v=<コミットID> を付けて、
# ブラウザに残った古い CSS / JS が使われないようにする。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # データベースのURLはリポジトリに置かず、Secrets の MP_DB_URL から config.js を作る
      - name: Write config.js from secrets
        env:
          MP_DB_URL: ${{ secrets.MP_DB_URL }}
        run: |
          if ! printf '%s' "$MP_DB_URL" | grep -Eq '^https://[a-z0-9.-]+\.(firebaseio\.com|firebasedatabase\.app)/?$'; then
            echo "The MP_DB_URL secret is missing or is not a Firebase Realtime Database URL." >&2
            exit 1
          fi
          printf "window.MP_DB_URL = '%s';\n" "${MP_DB_URL%/}" > config.js

      - name: Add a version to CSS/JS/data links
        run: |
          v="${GITHUB_SHA::8}"
          sed -i -E "s#(href|src)=\"((css|js|data)/[^\"?]+|config\.js)\"#\1=\"\2?v=${v}\"#g" mitigation-planner.html
          count=$(grep -o "?v=${v}" mitigation-planner.html | wc -l)
          echo "versioned links: ${count}"
          test "${count}" -gt 0

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
