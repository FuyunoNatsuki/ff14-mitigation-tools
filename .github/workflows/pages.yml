# main に push したら GitHub Pages に公開する。
# 公開のたびに css/ js/ data/ の読み込みへ ?v=<コミットID> を付けて、
# ブラウザに残った古い CSS / JS が使われないようにする。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Add a version to CSS/JS/data links
        run: |
          v="${GITHUB_SHA::8}"
          sed -i -E "s#(href|src)=\"((css|js|data)/[^\"?]+)\"#\1=\"\2?v=${v}\"#g" mitigation-planner.html

      # 中継サーバーのソースは公開ページに含めない
      - name: Leave the relay server out of the site
        run: rm -rf worker
          count=$(grep -o "?v=${v}" mitigation-planner.html | wc -l)
          echo "versioned links: ${count}"
          test "${count}" -gt 0

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
